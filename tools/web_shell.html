<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#a8c9cc">
<title>Swell &amp; Stow</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<link rel="alternate icon" type="image/png" href="favicon.png?v=1">
<link rel="apple-touch-icon" href="favicon.png?v=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#739d9b;color:#fff8dd;font-family:system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#launch{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:clamp(18px,4vw,56px);isolation:isolate;background:#739d9b}
#launch:before{content:"";position:absolute;inset:-50px;z-index:-1;background:linear-gradient(#8ab6aa70,#345e64bb),url(cover.png) center/cover;filter:blur(28px);opacity:.8}
.cover-card{position:relative;width:min(320px,72vw,calc(60svh * 1672 / 941));aspect-ratio:1672/941;overflow:visible;border-radius:16px;background:#164b5a url(cover.png) center/cover no-repeat;border:1px solid #f4d48640;box-shadow:0 28px 80px #031e3180,0 4px 16px #031e3140;transition:filter .18s,transform .18s}.cover-card:has(#play:not(:disabled)):hover,.cover-card:focus-within{filter:brightness(1.025);transform:scale(1.018)}.cover-card:has(#play:not(:disabled)):active{transform:scale(.99)}
.panel{position:absolute;top:calc(100% + 20px);left:-20px;right:-20px;text-align:center;color:#fff8df;text-shadow:0 1px 5px #163c55;font-size:13px}
#play{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:inherit;background:transparent;color:#fff4d2;cursor:pointer;font:500 13px system-ui,sans-serif}#play:focus-visible{outline:2px solid #ffe4a4;outline-offset:-3px}#play:disabled{cursor:wait}[hidden]{display:none!important}.panel{pointer-events:none}@media(prefers-reduced-motion:reduce){.cover-card{transition:none}.cover-card:has(#play:not(:disabled)):hover,.cover-card:has(#play:not(:disabled)):active{transform:none}}
#status{margin:0;font-size:13px}#status:empty{display:none}progress{display:block;width:170px;max-width:100%;height:5px;margin:0 auto 10px;accent-color:#f6d580}#error{max-width:600px;white-space:pre-wrap;overflow-wrap:anywhere;color:#ffd2bd;margin:0;background:#739d9bed;border-radius:12px;padding:12px}#error:empty{display:none}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser needs WebGL 2 to play Swell & Stow.</canvas>
<section id="launch" aria-label="Swell & Stow game cover"><div class="cover-card"><div class="panel"><progress id="progress" aria-label="Loading game"></progress><p id="status" role="status">Loading Swell & Stow…</p><p id="error" role="alert"></p></div><button id="play" aria-label="Play Swell & Stow" hidden disabled></button></div></section>
<script src="$GODOT_URL"></script>
<script>
const config = $GODOT_CONFIG;
const canvas=document.getElementById('canvas');
const play=document.getElementById('play'),bar=document.getElementById('progress'),status=document.getElementById('status');
config.canvas=canvas;
config.onProgress=(current,total)=>{
 if(total){bar.max=total;bar.value=current;}
 else bar.removeAttribute('value');
};
const engine = new Engine(config);
const executable=config.executable;
const pack=config.mainPack || `${executable}.pck`;
let ready=false;
// Download and initialize the runtime without starting the game clock or audio.
Promise.all([engine.init(executable),engine.preloadFile(pack,pack)]).then(()=>{
 ready=true;bar.style.display='none';status.textContent='';
 play.disabled=false;play.hidden=false;
}).catch(showError);
const hoverSound=new Audio('hover.wav'),pressSound=new Audio('press.wav');
hoverSound.volume=.75;pressSound.volume=.85;
let lastHover=-Infinity;
function sound(clip){clip.currentTime=0;const pending=clip.play();if(pending)pending.catch(()=>{});}
play.addEventListener('pointerenter',()=>{const now=performance.now();if(ready && now-lastHover>180){sound(hoverSound);lastHover=now;}});
play.addEventListener('focus',()=>{if(ready && !play.matches(':hover'))sound(hoverSound);});
play.addEventListener('click',async()=>{
 if(!ready)return;
 sound(pressSound);
 ready=false;play.disabled=true;status.textContent='Preparing cargo…';
 try {
  // start() reuses the prepared runtime and pack; no second resource download.
  await engine.start({args:['--main-pack',pack,'--','--web-launch',...(config.args || [])]});
  document.title='Swell & Stow';
  document.getElementById('launch').remove();canvas.focus();
 }catch(error){showError(error);}
});
function showError(error){
 ready=false;play.hidden=true;bar.style.display='none';
 document.getElementById('error').textContent=String(error);status.textContent='Unable to load';
}
</script>
</body>
</html>
